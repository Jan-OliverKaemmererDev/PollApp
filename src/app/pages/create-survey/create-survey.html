<!-- Overlay + Toast -->
<ng-container *ngIf="showToast">
  <div class="survey-overlay" (click)="showToast = false"></div>
  <div class="survey-toast">
    <span class="survey-toast__text">Your survey is now<br>published</span>
    <button class="survey-toast__close" (click)="showToast = false">✕</button>
  </div>
</ng-container>

<div class="create-survey-page">
  <div class="survey-form-container">
    <div class="form-header">
      <div class="header-left">
        <span class="badge-draft">Draft</span>
        <h1>Create new survey</h1>
      </div>
      <button class="btn-cancel" (click)="cancel()">Cancel ✕</button>
    </div>

    <form [formGroup]="surveyForm" class="survey-form">
      <div class="form-grid">
        <!-- Survey Info Block -->
        <div class="grid-item info-block">
          <div class="form-group">
            <label>Survey name</label>
            <div class="input-with-delete">
              <input type="text" formControlName="title">
              <button type="button" class="btn-icon-only" (click)="clearField('title')">
                <img src="assets/icons/delete.svg" alt="Delete" class="icon-default">
                <img src="assets/icons/delete-hover.svg" alt="Delete Hover" class="icon-hover">
              </button>
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label>Set end date <span class="optional">(optional)</span></label>
              <div class="input-with-delete">
                <input type="text" formControlName="ends_in">
                <button type="button" class="btn-icon-only" (click)="clearField('ends_in')">
                  <img src="assets/icons/delete.svg" alt="Delete" class="icon-default">
                  <img src="assets/icons/delete-hover.svg" alt="Delete Hover" class="icon-hover">
                </button>
              </div>
            </div>
            <div class="form-group category-group">
              <div class="category-dropdown-container">
                <div class="category-header" (click)="toggleCategoryDropdown()" [class.open]="isCategoryDropdownOpen">
                  <span>Choose category</span>
                  <img src="assets/icons/arrow-dropdown-white.svg" alt="Arrow" class="arrow-icon white-arrow">
                  <img src="assets/icons/arrow-dropdown-orange.svg" alt="Arrow" class="arrow-icon orange-arrow">
                </div>
                <div class="selected-category-text" *ngIf="surveyForm.get('category')?.value">
                  {{ surveyForm.get('category')?.value }}
                </div>
                <div class="dropdown-menu" *ngIf="isCategoryDropdownOpen">
                  <div class="dropdown-item" *ngFor="let cat of categories" (click)="selectCategory(cat)">
                    {{cat}}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Description Block -->
        <div class="grid-item desc-block">
          <div class="form-group">
            <label>Describing text <span class="optional">(optional)</span></label>
            <div class="input-with-delete">
              <textarea formControlName="description"></textarea>
              <button type="button" class="btn-icon-only textarea-btn" (click)="clearField('description')">
                <img src="assets/icons/delete.svg" alt="Delete" class="icon-default">
                <img src="assets/icons/delete-hover.svg" alt="Delete Hover" class="icon-hover">
              </button>
            </div>
          </div>
        </div>

        <!-- Questions Loop -->
        <ng-container formArrayName="questions">
          <div class="grid-item question-block" *ngFor="let question of questions.controls; let i = index" [formGroupName]="i">
            <div class="question-header">
              <label>{{i + 1}}. Question</label>
              <button type="button" class="btn-icon-only" (click)="removeQuestion(i)">
                <img src="assets/icons/delete.svg" alt="Delete" class="icon-default">
                <img src="assets/icons/delete-hover.svg" alt="Delete Hover" class="icon-hover">
              </button>
            </div>
            <div class="input-with-delete">
              <input type="text" formControlName="question_text">
            </div>

            <div class="answers-header">
              <label>Answers</label>
              <label class="checkbox-label">
                <input type="checkbox" formControlName="allowMultiple">
                Allow multiple answers.
              </label>
            </div>

            <div formArrayName="options" class="answers-list">
              <div class="answer-item" *ngFor="let option of getAnswers(i).controls; let j = index" [formGroupName]="j">
                <span class="answer-letter">{{getAlphabetLetter(j)}}</span>
                <div class="input-with-delete">
                  <input type="text" formControlName="label">
                  <button type="button" class="btn-icon-only" (click)="removeAnswer(i, j)">
                    <img src="assets/icons/delete.svg" alt="Delete" class="icon-default">
                    <img src="assets/icons/delete-hover.svg" alt="Delete Hover" class="icon-hover">
                  </button>
                </div>
              </div>
            </div>

            <button type="button" class="btn-add-answer" (click)="addAnswer(i)">
              <span>Add answer</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                <path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </ng-container>

        <!-- Add Next Question Button -->
        <div class="grid-item add-question-block">
          <button type="button" class="btn-add-question" (click)="addQuestion()">
            Add next question 
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
              <path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

      </div>

      <div class="form-footer">
        <button type="button" class="btn-publish" (click)="publish()" [disabled]="isPublishing">
          <span class="btn-text">Publish</span>
          <img src="assets/icons/publish-check.svg" alt="Publish" class="btn-icon">
        </button>
      </div>
    </form>
  </div>
</div>
