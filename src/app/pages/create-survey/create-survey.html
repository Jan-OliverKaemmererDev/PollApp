<div class="create-survey-page">
  <div class="survey-form-container">
    <div class="form-header">
      <div class="header-left">
        <span class="badge-draft">Draft</span>
        <h1>Create new survey</h1>
      </div>
      <button class="btn-cancel" (click)="cancel()">Cancel ✕</button>
    </div>

    <form [formGroup]="surveyForm" class="survey-form">
      <div class="form-grid">
        <!-- Survey Info Block -->
        <div class="grid-item info-block">
          <div class="form-group">
            <label>Survey name</label>
            <div class="input-with-icon">
              <input type="text" formControlName="title">
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label>Set end date <span class="optional">(optional)</span></label>
              <div class="input-with-icon">
                <input type="text" formControlName="ends_in">
              </div>
            </div>
            <div class="form-group">
              <label>Choose category</label>
              <select formControlName="category">
                <option value="" disabled selected></option>
                <option *ngFor="let cat of categories" [value]="cat">{{cat}}</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Description Block -->
        <div class="grid-item desc-block">
          <div class="form-group">
            <label>Describing text <span class="optional">(optional)</span></label>
            <textarea formControlName="description"></textarea>
          </div>
        </div>

        <!-- Questions Loop -->
        <ng-container formArrayName="questions">
          <div class="grid-item question-block" *ngFor="let question of questions.controls; let i = index" [formGroupName]="i">
            <div class="question-header">
              <label>{{i + 1}}. Question</label>
              <button type="button" class="btn-icon-only" (click)="removeQuestion(i)" *ngIf="questions.length > 1">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
            <div class="input-with-icon">
              <input type="text" formControlName="question_text">
            </div>

            <div class="answers-header">
              <label>Answers</label>
              <label class="checkbox-label">
                <input type="checkbox" formControlName="allowMultiple">
                Allow multiple answers.
              </label>
            </div>

            <div formArrayName="options" class="answers-list">
              <div class="answer-item" *ngFor="let option of getAnswers(i).controls; let j = index" [formGroupName]="j">
                <span class="answer-letter">{{getAlphabetLetter(j)}}</span>
                <div class="input-with-icon">
                  <input type="text" formControlName="label">
                  <button type="button" class="btn-icon-only" (click)="removeAnswer(i, j)" *ngIf="getAnswers(i).length > 2">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </div>
              </div>
            </div>

            <button type="button" class="btn-add-answer" (click)="addAnswer(i)">
              <span>Add answer</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                <path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </ng-container>

        <!-- Add Next Question Button -->
        <div class="grid-item add-question-block">
          <button type="button" class="btn-add-question" (click)="addQuestion()">
            Add next question 
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
              <path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

      </div>

      <div class="form-footer">
        <button type="button" class="btn-publish" (click)="publish()">Publish</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast Notification -->
<div class="toast-container" *ngIf="showToast">
  <div class="toast">
    <span class="toast-text">Your survey is now<br>published</span>
    <button class="btn-close-toast" (click)="showToast = false">✕</button>
  </div>
</div>
